<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar | Bella Ginástica</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="login.css"></head><body><a class="brand" href="index.html">BELLA <i>ginástica</i></a><main><p>ÁREA DA CLIENTE</p><h1>Bem-vinda<br><i>de volta.</i></h1><span>Entre para acompanhar seus pedidos e comprar com mais facilidade.</span><form id="login-form"><label>E-mail<input name="email" required type="email" placeholder="SEU E-MAIL"></label><label>Senha<input name="password" required type="password" maxlength="15" placeholder="ATÉ 15 CARACTERES"></label><button>entrar na minha conta <b>↗</b></button><p class="form-error" id="login-error"></p></form><p class="register-note">Ainda não tem cadastro? <a href="cadastro.html">Criar minha conta →</a></p><a href="index.html">← voltar para a loja</a></main><script>document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget)),users=JSON.parse(localStorage.getItem('bella-users')||'[]'),user=users.find(u=>u.email===data.email&&u.password===data.password);if(!user){document.querySelector('#login-error').textContent='E-mail ou senha não encontrados.';return}localStorage.setItem('bella-user',JSON.stringify(user));location.href='index.html'});</script></body></html>
