<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Criar conta | Bella Ginástica</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="login.css"></head><body class="register"><a class="brand" href="index.html">BELLA <i>ginástica</i></a><main><p>NOVA CLIENTE</p><h1>Crie sua<br><i>conta.</i></h1><span>É rápido e facilita seus próximos pedidos.</span><form id="register-form"><label>E-mail<input name="email" required type="email" placeholder="SEU E-MAIL"></label><label>Senha<input name="password" required type="password" maxlength="15" minlength="4" placeholder="ATÉ 15 CARACTERES"></label><label>Confirmar senha<input name="confirm" required type="password" maxlength="15" placeholder="REPITA SUA SENHA"></label><button>criar meu cadastro <b>↗</b></button><p class="form-error" id="register-error"></p></form><p class="register-note">Já tem cadastro? <a href="login.html">Entrar →</a></p><a href="index.html">← voltar para a loja</a></main><script>document.querySelector('#register-form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget)),error=document.querySelector('#register-error'),users=JSON.parse(localStorage.getItem('bella-users')||'[]');if(data.password!==data.confirm){error.textContent='As senhas precisam ser iguais.';return}if(users.some(u=>u.email===data.email)){error.textContent='Este e-mail já possui cadastro.';return}const user={email:data.email,password:data.password};users.push(user);localStorage.setItem('bella-users',JSON.stringify(users));localStorage.setItem('bella-user',JSON.stringify(user));location.href='index.html'});</script></body></html>
